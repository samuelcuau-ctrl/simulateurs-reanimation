<script>
{
// ===== Contenu : Ventilation mécanique, niveau Socle =====
const MOD={id:'ventilation-socle',title:'Ventilation mécanique',level:'Socle',
 intro:"Pour la première année du DES : comprendre ce que mesure le respirateur, poser des premiers réglages sûrs, corriger l'oxygénation et le CO₂, réagir à une alarme et ventiler un SDRA de façon protectrice.",
 refs:[
  "ESICM guidelines on ARDS: definition, phenotyping and respiratory support strategies. Grasselli G et al. Intensive Care Med 2023;49:727-759.",
  "Formalised guidelines: management of acute respiratory distress syndrome. Papazian L et al. (SRLF). Ann Intensive Care 2019;9:69.",
  "ARDS Network. Ventilation with lower tidal volumes. N Engl J Med 2000;342:1301-1308.",
  "Guérin C et al. Prone positioning in severe ARDS (PROSEVA). N Engl J Med 2013;368:2159-2168.",
  "Amato MBP et al. Driving pressure and survival in ARDS. N Engl J Med 2015;372:747-755."
 ]};

const CH=[
{id:'c1',t:'Ce que mesure le respirateur',
 goal:"Lire les pressions, mesurer la compliance et la résistance.",
 html:`
<p>En <b>ventilation en volume contrôlé (VC)</b>, vous imposez le volume courant (Vt) et le débit inspiratoire. La pression dans les voies aériennes (Paw) est la <b>résultante</b> : elle dépend du patient.</p>
<h4>L'équation du mouvement</h4>
<div class="eq">Paw = PEP totale + R × débit + Vt / C</div>
<ul>
<li><b>R × débit</b> : la pression pour faire passer le gaz dans la sonde et les bronches (résistance R, en cmH₂O/L/s).</li>
<li><b>Vt / C</b> : la pression pour distendre le poumon et la paroi (compliance C, en mL/cmH₂O).</li>
</ul>
<h4>Trois pressions à connaître</h4>
<ul>
<li><b>Pression de crête (Ppic)</b> : le maximum, en fin d'insufflation. Elle contient la part résistive et la part élastique.</li>
<li><b>Pression de plateau (Pplat)</b> : mesurée pendant une <b>pause télé-inspiratoire</b> (0,5 à 1 s, patient passif). Le débit est nul, la part résistive disparaît : il ne reste que la PEP totale et Vt/C.</li>
<li><b>PEP totale</b> : mesurée pendant une <b>pause télé-expiratoire</b>. Si elle dépasse la PEP réglée, la différence est la <b>PEP intrinsèque</b> (auto-PEP) : l'expiration n'était pas finie.</li>
</ul>
<div class="key"><b>Ppic − Pplat</b> = R × débit → reflète les <b>résistances</b>.<br><b>Pplat − PEP totale</b> = pression motrice = Vt / C → reflète la <b>compliance</b>.</div>
<h4>Calculs utiles</h4>
<ul>
<li>Compliance = Vt / (Pplat − PEP totale). Valeur habituelle chez un patient intubé sans atteinte pulmonaire : environ 50 à 80 mL/cmH₂O.</li>
<li>Résistance = (Ppic − Pplat) / débit (en L/s). Valeur habituelle d'un patient intubé : environ 10 à 15 cmH₂O/L/s, l'essentiel venant de la sonde.</li>
</ul>
<h4>Lire les courbes</h4>
<p>En VC à débit constant, la courbe de débit est carrée à l'inspiration. À l'expiration, le débit doit <b>revenir à zéro</b> avant le cycle suivant ; sinon, il reste du gaz piégé (auto-PEP).</p>
<p class="mut">Ces mesures n'ont de sens que chez un patient passif (sédaté, sans effort). Un patient qui respire fausse la pause.</p>`},
{id:'c2',t:'Premiers réglages',
 goal:"Régler un patient qui vient d'être intubé, sans atteinte pulmonaire sévère.",
 html:`
<h4>1. Calculer le poids prédit (PBW)</h4>
<p>Le volume des poumons dépend de la <b>taille</b> et du sexe, pas du poids réel.</p>
<div class="eq">Homme : 50 + 0,91 × (taille en cm − 152,4)<br>Femme : 45,5 + 0,91 × (taille en cm − 152,4)</div>
<p>Exemple : un homme de 180 cm a un poids prédit de 75 kg, qu'il pèse 70 ou 130 kg.</p>
<h4>2. Volume courant</h4>
<p><b>6 à 8 mL/kg de poids prédit</b>. Régler le Vt sur le poids réel chez un patient obèse expose à la surdistension.</p>
<h4>3. Fréquence respiratoire</h4>
<p>Environ 14 à 20 /min au départ, puis ajustée sur le pH et la PaCO₂ des gaz du sang. La ventilation minute = Vt × FR.</p>
<h4>4. PEP</h4>
<p>Au moins <b>5 cmH₂O</b> : elle limite le dérecrutement des bases, surtout chez un patient couché et sédaté.</p>
<h4>5. FiO₂</h4>
<p>Souvent 100 % juste après l'intubation, puis <b>réduite rapidement</b> pour viser une SpO₂ d'environ 92 à 96 %. L'hyperoxie n'apporte pas de bénéfice et a ses propres effets délétères.</p>
<h4>6. Temps inspiratoire</h4>
<p>Le débit inspiratoire et le temps inspiratoire (Ti) fixent le rapport I:E, habituellement autour de 1:2. Raccourcir le Ti augmente le débit, donc la Ppic, mais allonge l'expiration.</p>
<h4>7. Contrôler</h4>
<ul><li>Pause télé-inspiratoire : Pplat ≤ 30 cmH₂O, pression motrice ≤ 15 cmH₂O.</li><li>Pause télé-expiratoire : pas d'auto-PEP significative.</li><li>Gaz du sang 20 à 30 minutes après les réglages.</li><li>Limites d'alarme adaptées (pression haute, volume expiré, ventilation minute, FR).</li></ul>`},
{id:'c3',t:'Oxygénation et CO₂',
 goal:"Savoir quel réglage corrige quoi.",
 html:`
<p>Deux problèmes, deux familles de réglages :</p>
<div class="two"><div><h4>Oxygénation (PaO₂, SpO₂)</h4><ul><li><b>FiO₂</b></li><li><b>PEP</b> : recrute des alvéoles et diminue le shunt</li><li>(plus tard : décubitus ventral, curares, ECMO)</li></ul></div>
<div><h4>CO₂ (PaCO₂, pH)</h4><ul><li><b>Ventilation alvéolaire</b> = FR × (Vt − espace mort)</li><li>On agit d'abord sur la <b>FR</b>, puis sur le Vt dans les limites protectrices</li></ul></div></div>
<h4>Le CO₂</h4>
<p>La PaCO₂ est inversement proportionnelle à la ventilation alvéolaire : doubler la ventilation alvéolaire divise environ la PaCO₂ par deux. L'espace mort (sonde, raccords, zones ventilées mais non perfusées) ne participe pas aux échanges : un Vt très bas augmente sa part.</p>
<p>Augmenter la FR raccourcit le temps expiratoire : surveillez l'auto-PEP (débit expiratoire qui ne revient pas à zéro), surtout chez le patient obstructif.</p>
<p><b>Hypercapnie permissive</b> : pour respecter les limites de pression, on accepte une PaCO₂ élevée tant que le pH reste au-dessus d'environ 7,20 et en l'absence d'hypertension intracrânienne.</p>
<h4>L'oxygène</h4>
<p>La FiO₂ corrige vite l'hypoxémie mais ne traite pas le shunt quand des alvéoles sont fermées. La PEP rouvre les zones recrutables, avec deux limites : <b>surdistension</b> des zones déjà ouvertes (la Pplat monte) et <b>baisse du retour veineux</b> (hypotension).</p>
<p>Cibles usuelles : SpO₂ 92 à 96 % chez la plupart des patients ; dans le SDRA, des cibles un peu plus basses (SpO₂ 88 à 95 %, PaO₂ 55 à 80 mmHg) sont acceptées pour limiter FiO₂ et pressions.</p>
<div class="key">Rapport PaO₂/FiO₂ (P/F) : PaO₂ en mmHg divisée par la FiO₂ en fraction. Exemple : PaO₂ 90 sous FiO₂ 0,6 → P/F 150.</div>`},
{id:'c4',t:'Alarmes et dépannage',
 goal:"Réagir à une alarme de pression ou à une désaturation brutale.",
 html:`
<h4>Désaturation brutale ou patient instable : DOPE</h4>
<p>Si la situation est grave et la cause pas évidente : <b>débrancher et ventiler au ballon en O₂ pur</b>, puis chercher :</p>
<ul><li><b>D</b>éplacement de la sonde (extubation, intubation sélective)</li><li><b>O</b>bstruction (sécrétions, sonde coudée ou mordue)</li><li><b>P</b>neumothorax</li><li><b>É</b>quipement (circuit, filtre, respirateur, O₂)</li></ul>
<p>Si le ballon est facile et le patient s'améliore, le problème est souvent du côté du respirateur ou du circuit.</p>
<h4>Alarme de pression haute en VC : faire une pause télé-inspiratoire</h4>
<table><tr><th>Ppic</th><th>Pplat</th><th>Mécanisme</th><th>Causes</th></tr>
<tr><td>↑</td><td>stable</td><td>Résistances ↑</td><td>Sonde coudée ou mordue, sécrétions, bronchospasme, filtre encrassé</td></tr>
<tr><td>↑</td><td>↑</td><td>Compliance ↓</td><td>Intubation sélective, atélectasie, pneumothorax, épanchement, distension abdominale, auto-PEP</td></tr></table>
<h4>Pression basse ou volume expiré bas</h4>
<p>Fuite : déconnexion, ballonnet dégonflé ou percé, sonde remontée dans le pharynx, fuite par un drain.</p>
<h4>Capnographie</h4>
<p>La disparition brutale de l'EtCO₂ évoque une extubation, une obstruction complète ou un arrêt circulatoire. C'est l'alarme la plus précoce d'un déplacement de sonde.</p>
<h4>Auto-PEP</h4>
<p>Débit expiratoire qui ne revient pas à zéro, PEP totale supérieure à la PEP réglée. On allonge le temps expiratoire : baisser la FR, raccourcir le Ti, traiter l'obstruction.</p>
<h4>Patient qui « lutte »</h4>
<p>Avant d'approfondir la sédation, chercher une cause : douleur, hypoxémie, réglage inadapté (débit insuffisant, trigger), sonde, globe vésical.</p>`},
{id:'c5',t:'SDRA : ventiler sans nuire',
 goal:"Appliquer la ventilation protectrice et connaître les étapes suivantes.",
 html:`
<h4>Reconnaître le SDRA (définition de Berlin)</h4>
<ul><li>Début dans la semaine suivant une agression ou des symptômes respiratoires nouveaux</li><li>Opacités bilatérales non expliquées par un épanchement, une atélectasie ou des nodules</li><li>Œdème non expliqué uniquement par une insuffisance cardiaque ou une surcharge</li><li>Hypoxémie sous PEP ≥ 5 cmH₂O : P/F 201 à 300 léger, 101 à 200 modéré, ≤ 100 sévère</li></ul>
<p class="mut">Une définition globale actualisée a été proposée en 2024 (intégrant notamment les patients sous oxygène à haut débit) ; les seuils de P/F restent les repères pratiques sous ventilation invasive.</p>
<h4>Le poumon « bébé »</h4>
<p>Dans le SDRA, le volume de poumon aéré est réduit : un Vt « normal » distend ce petit poumon. La compliance basse traduit surtout cette réduction.</p>
<h4>Ventilation protectrice</h4>
<ul>
<li><b>Vt 6 mL/kg de poids prédit</b> (fourchette recommandée 4 à 8)</li>
<li><b>Pplat ≤ 30 cmH₂O</b></li>

// ===== Respirateur intégré : modèle et interface =====
function model(P,S){
  const Vt=S.Vt/1000,Ttot=60/S.FR,Ti=Math.min(S.Ti,Ttot*0.8),Te=Ttot-Ti,Q=Vt/Ti,tau=P.R*P.C;
  const e=Math.exp(-Te/tau),Vtrap=Vt*e/(1-e),pepi=Vtrap/P.C,peptot=S.PEP+pepi;
  const pplat=peptot+Vt/P.C,ppic=pplat+P.R*Q;
  const ve=Vt*S.FR,va=Math.max(0.3,S.FR*(Vt-P.Vd)),paco2=Math.min(140,P.K/va),ph=6.1+Math.log10(P.hco3/(0.03*paco2));
  const d=S.PEP-5;let pf=P.pf+P.gain*Math.max(-3,Math.min(d,P.popt-5));if(S.PEP>P.popt)pf-=(P.over||4)*(S.PEP-P.popt);
  if(pplat>32)pf-=2*(pplat-32);
  pf=Math.max(45,pf);const pao2=Math.min(600,pf*S.FiO2);
  const spo2=100/(23400/(pao2**3+150*pao2)+1);
  return {Vt,Ti,Te,Q,tau,Vtrap,pepi,peptot,pplat,ppic,ve,paco2,ph,pao2,pf,spo2};
}
const fmt=(x,d=0)=>x.toFixed(d).replace('.',',');

    const ym=h1+h2/2;ctx.strokeStyle='rgba(147,168,175,.3)';ctx.beginPath();ctx.moveTo(30,ym);ctx.lineTo(W,ym);ctx.stroke();
    const yP=p=>h1-6-(p/pmax)*(h1-24),yQ=q=>ym-(q/qmax)*(h2/2-10);
    const paw=[],flo=[];
    for(let t=0;t<=T;t+=T/600){let c=t%cyc,p,q;

      else{q=0;p=M.peptot;}

    line(paw,'#ffc53d');line(flo,'#4fd8ea');

      +cell('P motrice',st.pi&&st.pe?fmt(M.pplat-M.peptot):'—','cmH₂O','p')+cell('VE',fmt(M.ve,1),'L/min','q')+cell('SpO₂',fmt(M.spo2),'%','s');

  }

    S[k]=v;st.pi=st.pe=st.gas=false;render();});
  root.querySelectorAll('.vbtns button').forEach(b=>b.onclick=()=>{st[b.dataset.a]=true;render();});
  if(ex.diag){
    const D=ex.diag,box=$('.diag'),ask=(key,okKey,title,opts,after)=>{
      const div=document.createElement('div');div.className='dq';div.innerHTML=`<p class="dqt">${title}</p><div class="choices"></div><div class="fb"></div>`;box.appendChild(div);

  if(id==='exam'&&allDone())return exam();
  if(id==='cert'&&passed())return cert();
  home();
}

function home(){
  sidebar('home');
  const btn=(i)=>{const c=CH[i],p=chP(c.id);const s=chDone(c.id)?'Terminé':!chOpen(i)?'Verrouillé':p.read||p.sim||p.quiz?'En cours':'À faire';
    return `<a class="chcard ${chOpen(i)?'':'locked'}" ${chOpen(i)?`href="#${c.id}"`:''}><span class="num">${i+1}</span><span><b>${c.t}</b><small>${c.goal}</small></span>
    <span class="steps3"><i class="${p.read?'y':''}">Cours</i><i class="${p.sim?'y':''}">Exercice</i><i class="${p.quiz>=QUIZ_PASS?'y':''}">Quiz ${p.quiz?Math.round(p.quiz*100)+' %':''}</i></span><span class="st">${s}</span></a>`;};
  const lock=examLock();
  V.innerHTML=`<h1>${MOD.title} <span class="lvl">Niveau ${MOD.level}</span></h1><p class="lede">${MOD.intro}</p>
  <div class="howto"><div><b>1. Cours</b><span>Dix minutes de lecture, les repères à retenir.</span></div><div><b>2. Au respirateur</b><span>Un patient à régler : le respirateur vérifie si l'objectif est atteint.</span></div><div><b>3. Quiz</b><span>${QUIZ_N} questions tirées au hasard, ${Math.round(QUIZ_PASS*100)} % pour passer au chapitre suivant.</span></div></div>
  <h2>Chapitres</h2><div class="chlist">${CH.map((c,i)=>btn(i)).join('')}
  <a class="chcard ${allDone()?'':'locked'}" ${allDone()?'href="#exam"':''}><span class="num">✓</span><span><b>Examen du module</b><small>${CH.length*EXAM_PER_CH} questions sur tout le module et 2 épreuves au respirateur · ${Math.round(EXAM_PASS*100)} % pour valider · 2 tentatives, puis 24 heures d'attente</small></span><span class="st">${passed()?'Validé':lock?'Disponible le '+new Date(lock).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):allDone()?'Disponible':'Verrouillé'}</span></a></div>
  <details class="refs"><summary>Références</summary><ul>${MOD.refs.map(r=>`<li>${r}</li>`).join('')}</ul></details>
  <div class="saverow"><p class="mut small">La progression est enregistrée dans ce navigateur, sur cet appareil. Pour changer d'appareil, sauvegardez-la dans un fichier puis importez-la.</p>
  <button id="bExp">Sauvegarder ma progression</button><label class="btn">Importer une progression<input type="file" id="bImp" accept="application/json" hidden></label></div>`;
  document.getElementById('bExp').onclick=exportProg;document.getElementById('bImp').onchange=importProg;
}
function exportProg(){const b=new Blob([JSON.stringify(store,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sim-icu-progression.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function importProg(e){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.modules)throw 0;localStorage.setItem(KEY,JSON.stringify(o));location.reload();}catch(x){alertBox('Ce fichier ne contient pas de progression SIM-ICU.');}});}
function alertBox(m){const d=document.createElement('p');d.className='ko-t';d.textContent=m;V.appendChild(d);}

function chapter(i,step){
  const c=CH[i],p=chP(c.id);step=step||(!p.read?'cours':!p.sim?'ex':'quiz');sidebar(c.id);
  const tab=(k,l,y)=>`<a href="#${c.id}/${k}" class="${step===k?'on':''}">${y?'✓ ':''}${l}</a>`;
  V.innerHTML=`<p class="kick">Chapitre ${i+1} sur ${CH.length}</p><h1>${c.t}</h1><nav class="ctabs">${tab('cours','Cours',p.read)}${tab('ex','Au respirateur',p.sim)}${tab('quiz','Quiz',p.quiz>=QUIZ_PASS)}</nav><div id="cbody"></div>`;
  const B=document.getElementById('cbody');
  if(step==='cours'){B.innerHTML=`<article class="cours">${c.html}</article><button class="primary" id="bRead">J'ai lu : passer à l'exercice</button>`;
    document.getElementById('bRead').onclick=()=>{p.read=true;save();go(c.id+'/ex');};}
  else if(step==='ex'){B.innerHTML=`<div id="vent"></div><p class="mut small">Pour aller plus loin en dehors du parcours : <a href="../../ventilation/">ouvrir le simulateur de ventilation complet</a>.</p><div id="next"></div>`;
    mountVent(document.getElementById('vent'),EX[c.id](false),{onDone(){p.sim=true;save();sidebar(c.id);
      document.getElementById('next').innerHTML=`<a class="primary btn" href="#${c.id}/quiz">Passer au quiz</a>`;}});}
  else quiz(i,B);
}

function qButtons(box,q,onPick){
  const opts=shuffle(q.o.map((o,k)=>({t:o[0],ok:!!o[1],k})));
  box.innerHTML=`<p class="qq">${q.q}</p><div class="choices">${opts.map((o,j)=>`<button data-j="${j}">${esc(o.t)}</button>`).join('')}</div><div class="fb"></div>`;
  box.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>onPick(opts[+b.dataset.j],b,opts));
}
function quiz(i,B){
  const c=CH[i],p=chP(c.id),qs=shuffle(QB.filter(q=>q.c===c.id)).slice(0,QUIZ_N);let k=0,good=0;
  function show(){
    if(k>=qs.length){const r=good/qs.length,ok=r>=QUIZ_PASS;if(r>p.quiz)p.quiz=r;save();sidebar(c.id);
      const nx=CH[i+1];
      B.innerHTML=`<div class="score ${ok?'ok':'ko'}"><b>${good} / ${qs.length}</b> · ${Math.round(r*100)} %</div><p>${ok?(nx?'Chapitre validé : le chapitre suivant est ouvert.':'Dernier chapitre validé.'):`Il faut ${Math.round(QUIZ_PASS*100)} % pour valider. Relisez le cours si besoin, puis recommencez : les questions changent.`}</p>
      ${!p.sim||!p.read?'<p class="ko-t">Pour terminer le chapitre, il reste '+(!p.read?'le cours':'')+(!p.read&&!p.sim?' et ':'')+(!p.sim?"l'exercice au respirateur":'')+'.</p>':''}
      <div class="row"><button id="bAgain">Recommencer le quiz</button>${chDone(c.id)?(nx?`<a class="primary btn" href="#${nx.id}">Chapitre suivant</a>`:allDone()?`<a class="primary btn" href="#exam">Aller à l'examen</a>`:''):''}</div>`;
      document.getElementById('bAgain').onclick=()=>quiz(i,B);return;}
    const q=qs[k];B.innerHTML=`<p class="kick">Question ${k+1} sur ${qs.length}</p><div class="qbox"></div><div class="row"><button class="primary" id="bNext" hidden>Question suivante</button></div>`;
    const box=B.querySelector('.qbox');let done=false;
    qButtons(box,q,(o,b,opts)=>{if(done)return;done=true;if(o.ok)good++;
      box.querySelectorAll('.choices button').forEach((x,j)=>{if(opts[j].ok)x.classList.add('ok');});if(!o.ok)b.classList.add('ko');
      box.querySelector('.fb').innerHTML=`<p>${o.ok?'<span class="ok-t">Exact.</span>':'<span class="ko-t">Non.</span>'} ${q.e}</p>`;
      const n=document.getElementById('bNext');n.hidden=false;n.textContent=k+1<qs.length?'Question suivante':'Voir le résultat';n.onclick=()=>{k++;show();};});
  }
  show();
}

function exam(){
  sidebar('exam');const lock=examLock();
  if(passed()){V.innerHTML=`<h1>Examen du module</h1><p>Module validé le ${new Date(passed().at).toLocaleDateString('fr-FR')} avec ${passed().score} / ${passed().total}.</p><p><a class="primary btn" href="#cert">Voir l'attestation</a></p><p class="mut small">Vous pouvez repasser l'examen pour vous entraîner ; le résultat validé est conservé.</p><button id="bRe">Repasser l'examen</button>`;
    document.getElementById('bRe').onclick=()=>runExam();return;}
  if(lock){V.innerHTML=`<h1>Examen du module</h1><p>Deux tentatives non validées : prochaine tentative possible le <b>${new Date(lock).toLocaleString('fr-FR',{dateStyle:'full',timeStyle:'short'})}</b>.</p><p>D'ici là, reprenez les chapitres et les quiz.</p>`;return;}
  const n=prog.exam.tries.length;
  V.innerHTML=`<h1>Examen du module</h1><ul class="rules"><li>${CH.length*EXAM_PER_CH} questions tirées au hasard (${EXAM_PER_CH} par chapitre), puis 2 épreuves au respirateur.</li><li>Une seule réponse par question. Les corrections ne s'affichent qu'à la fin.</li><li>Il faut ${Math.round(EXAM_PASS*100)} % du total (questions et épreuves comptent chacune 1 point).</li><li>Après deux tentatives non validées, l'examen se rouvre 24 heures plus tard.</li></ul>
  <p class="mut">${n?`Tentatives déjà faites : ${n}.`:''}</p><button class="primary" id="bGo">Commencer l'examen</button>`;
  document.getElementById('bGo').onclick=()=>runExam();
}
function runExam(){
  const qs=[];CH.forEach(c=>qs.push(...shuffle(QB.filter(q=>q.c===c.id)).slice(0,EXAM_PER_CH)));shuffle(qs);
  const exs=shuffle(EXAM_EX.slice()).slice(0,2).map(id=>EX[id](true));
  const ans=[],sims=[];let k=0;
  function show(){
    if(k<qs.length){const q=qs[k];V.innerHTML=`<p class="kick">Examen · question ${k+1} sur ${qs.length}</p><div class="pbar thin"><span style="width:${100*k/(qs.length+2)}%"></span></div><div class="qbox"></div>`;
      qButtons(V.querySelector('.qbox'),q,(o,b,opts)=>{ans.push({q,o,opts});k++;show();});return;}
    const j=k-qs.length;
    if(j<exs.length){V.innerHTML=`<p class="kick">Examen · épreuve au respirateur ${j+1} sur ${exs.length}</p><div class="pbar thin"><span style="width:${100*k/(qs.length+2)}%"></span></div><div id="vent"></div><div id="next"></div>`;
      mountVent(document.getElementById('vent'),exs[j],{exam:true,onDone(ok,crit,ex){sims.push({ok,crit,ex});document.getElementById('next').innerHTML='<button class="primary" id="bN">Continuer</button>';document.getElementById('bN').onclick=()=>{k++;show();};}});return;}
    finish();
  }
  function finish(){
    const sq=ans.filter(a=>a.o.ok).length,ss=sims.filter(s=>s.ok).length,tot=qs.length+sims.length,sc=sq+ss,ok=sc/tot>=EXAM_PASS-1e-9;
    const t={at:Date.now(),score:sc,total:tot,pass:ok};prog.exam.tries.push(t);if(ok&&!passed())prog.exam.passed=t;save();sidebar('exam');
    V.innerHTML=`<h1>Résultat de l'examen</h1><div class="score ${ok?'ok':'ko'}"><b>${sc} / ${tot}</b> · ${Math.round(100*sc/tot)} % · ${ok?'module validé':'non validé'}</div>
    <p>Questions : ${sq} / ${qs.length} · épreuves au respirateur : ${ss} / ${sims.length}.</p>
    ${ok?'<p><a class="primary btn" href="#cert">Obtenir l\'attestation</a></p>':`<p>Il fallait ${Math.ceil(EXAM_PASS*tot)} points. ${examLock()?'Prochaine tentative dans 24 heures.':'Vous pouvez faire une autre tentative.'}</p>`}
    <h2>Correction</h2><ol class="review">${ans.map(a=>`<li class="${a.o.ok?'ok':'ko'}"><p class="qq">${a.q.q}</p><p>${a.o.ok?'✓':'✗'} Votre réponse : ${esc(a.o.t)}${a.o.ok?'':`<br>Réponse attendue : <b>${esc(a.opts.find(x=>x.ok).t)}</b>`}</p><p class="mut">${a.q.e}</p></li>`).join('')}
    ${sims.map(s=>`<li class="${s.ok?'ok':'ko'}"><p class="qq">Épreuve : ${s.ex.title}</p><ul class="crit">${s.crit.map(x=>`<li class="${x.ok?'ok':'ko'}">${x.ok?'✓':'✗'} ${x.label}</li>`).join('')}</ul><p class="mut">${s.ex.debrief}</p></li>`).join('')}</ol>`;
  }
  show();
}

function cert(){
  sidebar('cert');const p=passed();const nm=prog.name||'';
  const code=(s=>{let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return (h>>>0).toString(36).toUpperCase().padStart(7,'0');});
  V.innerHTML=`<h1>Attestation</h1><p class="noprint"><label>Nom et prénom <input id="nm" value="${esc(nm)}" autocomplete="name"></label> <button class="primary" id="bPr">Imprimer ou enregistrer en PDF</button></p>
  <div class="cert"><img src="../../logo-sim-icu.svg" alt="SIM-ICU" class="clogo"><p class="ct">Attestation de réussite</p><p>Ce document atteste que</p><p class="cn" id="cn">${esc(nm)||'…'}</p>
  <p>a validé le module</p><p class="cm">${MOD.title} · niveau ${MOD.level}</p><p>de la formation SIM-ICU pour les internes de DES de médecine intensive-réanimation,</p>
  <p>le ${new Date(p.at).toLocaleDateString('fr-FR',{dateStyle:'long'})}, avec un score de ${p.score} / ${p.total} (${Math.round(100*p.score/p.total)} %, seuil ${Math.round(EXAM_PASS*100)} %).</p>
  <p class="mut small" id="cc"></p><p class="mut small">Attestation déclarative : la progression est enregistrée sur l'appareil de l'apprenant et n'est pas vérifiée par un serveur.</p></div>`;
  const upd=()=>{const v=document.getElementById('nm').value.trim();prog.name=v;save();document.getElementById('cn').textContent=v||'…';document.getElementById('cc').textContent='Code : '+code(v+'|'+MOD.id+'|'+p.at+'|'+p.score);};
  document.getElementById('nm').oninput=upd;document.getElementById('bPr').onclick=()=>window.print();upd();
}
route();

}
</script>
</body>
</html>
